{{- /* Hook-и до обновления релиза: бэкап (-10, только upgrade) → миграции (0). Откат релиза схему не откатывает. */ -}}
{{- if .Values.hooks.backupBeforeUpgrade }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aeza-risk.fullname" . }}-pre-upgrade-backup
  labels:
    {{- include "aeza-risk.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        {{- include "aeza-risk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backup
        {{- toYaml .Values.networkPolicy.dbClientLabel | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        {{- include "aeza-risk.podSecurity" . | nindent 8 }}
      {{- with .Values.hooks.backupNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "aeza-risk.waitForDb" . | nindent 8 }}
      containers:
        - name: pg-dump
          image: "{{ .Values.hooks.image.repository }}:{{ .Values.hooks.image.tag }}"
          imagePullPolicy: {{ .Values.hooks.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              OUT="/backups/aeza-$(date -u +%Y%m%dT%H%M%SZ)-pre-upgrade-r{{ .Release.Revision }}.dump"
              pg_dump -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -Fc --no-owner --no-privileges -f "$OUT.part"
              mv "$OUT.part" "$OUT"
              (cd /backups && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
              echo "backup: $OUT ($(wc -c < "$OUT") bytes)"
          env:
            - name: PGHOST
              value: {{ .Values.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.database.name | quote }}
            - name: PGUSER
              value: {{ .Values.database.ownerUser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.ownerSecret }}
                  key: password
          resources:
            {{- toYaml .Values.hooks.resources | nindent 12 }}
          securityContext:
            {{- include "aeza-risk.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: backups
              mountPath: /backups
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: {{ .Values.hooks.backupClaimName }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aeza-risk.fullname" . }}-migrate
  labels:
    {{- include "aeza-risk.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.hooks.migrationTimeoutSeconds }}
  template:
    metadata:
      labels:
        {{- include "aeza-risk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrator
        {{- toYaml .Values.networkPolicy.dbClientLabel | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "aeza-risk.podSecurity" . | nindent 8 }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "aeza-risk.waitForDb" . | nindent 8 }}
      containers:
        - name: migrator
          image: {{ include "aeza-risk.appImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["dotnet", "/app/service.migrator.dll"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.ownerSecret }}
                  key: password
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: app-db-password
            - name: ENV_App__DbConnectionString
              value: "Host={{ .Values.database.host }};Port={{ .Values.database.port }};Database={{ .Values.database.name }};Username={{ .Values.database.ownerUser }};Password=$(POSTGRES_PASSWORD)"
            - name: ENV_App__AppDbUser
              value: {{ .Values.database.appUser | quote }}
            - name: ENV_App__AppDbPassword
              value: "$(APP_DB_PASSWORD)"
          resources:
            {{- toYaml .Values.hooks.resources | nindent 12 }}
          securityContext:
            {{- include "aeza-risk.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
