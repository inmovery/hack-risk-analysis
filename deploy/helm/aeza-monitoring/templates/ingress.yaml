{{- if .Values.grafana.ingress.enabled }}
# Grafana — со своим входом (admin, регистрация выключена)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aeza-monitoring.fullname" . }}-grafana
  labels:
    {{- include "aeza-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  {{- with .Values.ingress.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ . }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ required "grafana.ingress.host обязателен" .Values.grafana.ingress.host | quote }}]
      secretName: {{ .Values.grafana.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.grafana.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aeza-monitoring.fullname" . }}-grafana
                port:
                  name: http
{{- end }}
{{- if .Values.prometheus.ingress.enabled }}
---
# Prometheus своей аутентификации не имеет: наружу только за basic auth Traefik
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "aeza-monitoring.fullname" . }}-prometheus-auth
  labels:
    {{- include "aeza-monitoring.labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ .Values.prometheus.ingress.basicAuthSecret }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aeza-monitoring.fullname" . }}-prometheus
  labels:
    {{- include "aeza-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "aeza-monitoring.fullname" . }}-prometheus-auth@kubernetescrd
    {{- with .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.prometheus.ingress.host | quote }}]
      secretName: {{ .Values.prometheus.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.prometheus.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aeza-monitoring.fullname" . }}-prometheus
                port:
                  name: http
{{- end }}
