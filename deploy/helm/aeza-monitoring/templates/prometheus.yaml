apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aeza-monitoring.fullname" . }}-prometheus
  labels:
    {{- include "aeza-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.scrapeInterval }}
    scrape_configs:
      # Бизнес-метрики сервиса без авторизации, внутри кластера (наружу /metrics не маршрутизируется)
      - job_name: aeza-risk
        metrics_path: /metrics
        static_configs:
          - targets: {{ toJson .Values.prometheus.targets }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aeza-monitoring.fullname" . }}-prometheus
  labels:
    {{- include "aeza-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.prometheus.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.prometheus.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aeza-monitoring.fullname" . }}-prometheus
  labels:
    {{- include "aeza-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  # Том RWO: старый под должен освободить TSDB до старта нового
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aeza-monitoring.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "aeza-monitoring.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
      annotations:
        checksum/config: {{ toJson .Values.prometheus.targets | sha256sum }}-{{ .Values.prometheus.scrapeInterval }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.prometheus.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            {{- if .Values.prometheus.ingress.enabled }}
            - --web.external-url=https://{{ required "prometheus.ingress.host обязателен" .Values.prometheus.ingress.host }}
            {{- end }}
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          securityContext:
            {{- include "aeza-monitoring.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ include "aeza-monitoring.fullname" . }}-prometheus
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "aeza-monitoring.fullname" . }}-prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aeza-monitoring.fullname" . }}-prometheus
  labels:
    {{- include "aeza-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  selector:
    {{- include "aeza-monitoring.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
